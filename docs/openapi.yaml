openapi: 3.1.0
info:
  title: Catalog Service API
  version: 1.0.0
  description: Tenant-scoped category management API.
servers:
  - url: http://localhost:3000/api/v1/catalog
    description: Local development
tags:
  - name: Catalog
  - name: Categories
  - name: Products
  - name: Variants
  - name: Add-ons
paths:
  /:
    get:
      tags: [Catalog]
      summary: Health check
      responses:
        "200":
          description: Service is running
          content:
            text/plain:
              schema:
                type: string
  /categories:
    get:
      tags: [Categories]
      summary: List all categories
      description: Returns active and inactive categories for the authenticated user's tenant.
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Categories retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Categories]
      summary: Create a category
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategory"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Categories]
      summary: Get a category
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Category retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Categories]
      summary: Update a category
      description: Rename, reorder, change icon, or reparent a category.
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategory"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Categories]
      summary: Delete an empty category
      description: Deletes only when the category has no products or child categories.
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "204":
          description: Category deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /categories/{id}/availability:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    patch:
      tags: [Categories]
      summary: Change category availability
      description: Activates or deactivates the category, descendants, and their products.
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive:
                  type: boolean
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - name: categoryId
          in: query
          schema: { type: string }
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Products retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Products]
      summary: Create a product with initial variants
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProduct" }
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Products]
      summary: Get product details
      description: Includes variants and attached add-ons.
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Product retrieved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Products]
      summary: Update product details
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProduct" }
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Products]
      summary: Soft-delete a product
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "204": { description: Product deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /products/{id}/availability:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Products]
      summary: Change product availability
      description: Admins, managers, and staff can toggle availability.
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /products/{productId}/variants:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Variants]
      summary: Add a variant to a product
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVariant" }
      responses:
        "201":
          description: Variant created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariantResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /variants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Variants]
      summary: Update a variant
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVariant" }
      responses:
        "200":
          description: Variant updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariantResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Variants]
      summary: Delete a variant
      description: Only admins can delete variants, and the final variant cannot be deleted.
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "204": { description: Variant deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /variants/{id}/availability:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Variants]
      summary: Change variant availability
      description: Admins, managers, and staff can toggle one variant.
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariantResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /add-ons:
    get:
      tags: [Add-ons]
      summary: List all add-ons
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Add-ons retrieved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddOnListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Add-ons]
      summary: Create an add-on
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAddOn" }
      responses:
        "201":
          description: Add-on created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddOnResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /add-ons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Add-ons]
      summary: Update an add-on
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAddOn" }
      responses:
        "200":
          description: Add-on updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddOnResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Add-ons]
      summary: Delete an add-on
      description: Deleting an add-on also removes its product attachments.
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "204": { description: Add-on deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /products/{productId}/add-ons/{addOnId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
      - name: addOnId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Add-ons]
      summary: Attach an add-on to a product
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "201":
          description: Add-on attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Add-ons]
      summary: Detach an add-on from a product
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "204": { description: Add-on detached }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
  parameters:
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    Category:
      type: object
      required: [id, tenantId, name, slug, displayOrder, isActive, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string, maxLength: 100 }
        slug: { type: string, maxLength: 100 }
        parentId: { type: [string, "null"] }
        displayOrder: { type: integer, minimum: 0 }
        icon: { type: [string, "null"], maxLength: 50 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateCategory:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: [string, "null"] }
        displayOrder: { type: integer, minimum: 0, default: 0 }
        icon: { type: [string, "null"], maxLength: 50 }
    UpdateCategory:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: [string, "null"] }
        displayOrder: { type: integer, minimum: 0 }
        icon: { type: [string, "null"], maxLength: 50 }
    CategoryResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: "#/components/schemas/Category" }
        status: { type: integer, const: 200 }
    CategoryListResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        status: { type: integer, const: 200 }
    Variant:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        label: { type: string, maxLength: 50 }
        price: { type: string }
        isDefault: { type: boolean }
        isActive: { type: boolean }
        displayOrder: { type: integer }
    AddOn:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string }
        price: { type: string }
        isActive: { type: boolean }
    Product:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        categoryId: { type: string }
        name: { type: string, maxLength: 150 }
        description: { type: [string, "null"] }
        imageUrl: { type: [string, "null"], format: uri }
        isVeg: { type: [boolean, "null"] }
        isActive: { type: boolean }
        displayOrder: { type: integer }
        attributes: { type: object }
        deletedAt: { type: [string, "null"], format: date-time }
        variants:
          type: array
          items: { $ref: "#/components/schemas/Variant" }
        addOns:
          type: array
          items: { $ref: "#/components/schemas/AddOn" }
    CreateProduct:
      type: object
      required: [name, categoryId, variants]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: [string, "null"] }
        imageUrl: { type: [string, "null"], format: uri }
        categoryId: { type: string }
        isVeg: { type: [boolean, "null"] }
        displayOrder: { type: integer, minimum: 0 }
        attributes: { type: object }
        addOnIds:
          type: array
          uniqueItems: true
          items: { type: string }
        variants:
          type: array
          minItems: 1
          items:
            type: object
            required: [label, price]
            properties:
              label: { type: string, maxLength: 50 }
              price: { type: number, minimum: 0 }
              isDefault: { type: boolean }
              displayOrder: { type: integer, minimum: 0 }
    UpdateProduct:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: [string, "null"] }
        imageUrl: { type: [string, "null"], format: uri }
        categoryId: { type: string }
        isVeg: { type: [boolean, "null"] }
    ProductResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: "#/components/schemas/Product" }
        status: { type: integer }
    ProductListResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        status: { type: integer, const: 200 }
    CreateVariant:
      type: object
      required: [label, price]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 50 }
        price: { type: number, minimum: 0 }
        isDefault: { type: boolean }
        displayOrder: { type: integer, minimum: 0 }
    UpdateVariant:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 50 }
        price: { type: number, minimum: 0 }
    VariantResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: "#/components/schemas/Variant" }
        status: { type: integer }
    CreateAddOn:
      type: object
      required: [name, price]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        price: { type: number, minimum: 0 }
        isActive: { type: boolean, default: true }
    UpdateAddOn:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        price: { type: number, minimum: 0 }
    AddOnResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: "#/components/schemas/AddOn" }
        status: { type: integer }
    AddOnListResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data:
          type: array
          items: { $ref: "#/components/schemas/AddOn" }
        status: { type: integer, const: 200 }
    AttachmentResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data:
          type: object
          properties:
            productId: { type: string }
            addOnId: { type: string }
        status: { type: integer, const: 201 }
    ErrorResponse:
      type: object
      required: [success, message, status]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        status: { type: integer }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Insufficient permissions or no tenant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Category not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Category conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
