openapi: 3.1.0
info:
  title: Catalog Service API
  version: 1.0.0
  description: Tenant-scoped category management API.
servers:
  - url: http://localhost:3000/api/v1/catalog
    description: Local development
tags:
  - name: Catalog
  - name: Categories
paths:
  /:
    get:
      tags: [Catalog]
      summary: Health check
      responses:
        "200":
          description: Service is running
          content:
            text/plain:
              schema:
                type: string
  /categories:
    get:
      tags: [Categories]
      summary: List all categories
      description: Returns active and inactive categories for the authenticated user's tenant.
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Categories retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Categories]
      summary: Create a category
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategory"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Categories]
      summary: Get a category
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: Category retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Categories]
      summary: Update a category
      description: Rename, reorder, change icon, or reparent a category.
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategory"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Categories]
      summary: Delete an empty category
      description: Deletes only when the category has no products or child categories.
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "204":
          description: Category deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /categories/{id}/availability:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    patch:
      tags: [Categories]
      summary: Change category availability
      description: Activates or deactivates the category, descendants, and their products.
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive:
                  type: boolean
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
  parameters:
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    Category:
      type: object
      required: [id, tenantId, name, slug, displayOrder, isActive, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string, maxLength: 100 }
        slug: { type: string, maxLength: 100 }
        parentId: { type: [string, "null"] }
        displayOrder: { type: integer, minimum: 0 }
        icon: { type: [string, "null"], maxLength: 50 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateCategory:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: [string, "null"] }
        displayOrder: { type: integer, minimum: 0, default: 0 }
        icon: { type: [string, "null"], maxLength: 50 }
    UpdateCategory:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: [string, "null"] }
        displayOrder: { type: integer, minimum: 0 }
        icon: { type: [string, "null"], maxLength: 50 }
    CategoryResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: "#/components/schemas/Category" }
        status: { type: integer, const: 200 }
    CategoryListResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        status: { type: integer, const: 200 }
    ErrorResponse:
      type: object
      required: [success, message, status]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        status: { type: integer }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Insufficient permissions or no tenant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Category not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Category conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
